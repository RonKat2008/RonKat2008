<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Ronit Katikaneni — an orbital system where each planet is a project">
  <title>Ronit Katikaneni</title>
  <desc>A star with five planets on inclined orbits. Each planet stands for a project or a piece of research.</desc>

  <defs>
    <!-- The site's palette, converted out of oklch so every renderer agrees on the colour. -->
    <radialGradient id="sky" cx="38%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141a30" />
      <stop offset="100%" stop-color="#0b0f1f" />
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9ba" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffc478" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#ffa050" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ff9646" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#fffaf0" />
      <stop offset="70%" stop-color="#ffd28a" />
      <stop offset="100%" stop-color="#f2ae4f" />
    </radialGradient>

    <!-- Planet bodies: a lit limb and a terminator, so each reads as a sphere rather than a dot. -->
    <radialGradient id="project" cx="35%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#a9ead9" />
      <stop offset="55%" stop-color="#3fa89a" />
      <stop offset="100%" stop-color="#123b3d" />
    </radialGradient>
    <radialGradient id="work" cx="35%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#f6cf9a" />
      <stop offset="55%" stop-color="#d08a4a" />
      <stop offset="100%" stop-color="#4a2a18" />
    </radialGradient>
    <radialGradient id="research" cx="35%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#e8f3ff" />
      <stop offset="55%" stop-color="#9cc4e8" />
      <stop offset="100%" stop-color="#28405e" />
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#sky)" />

  <!-- Star field. Fixed positions keep the banner identical on every load. -->
  <g fill="#cdd6ff">
    <circle cx="88" cy="42" r="1.1" opacity=".55" /><circle cx="212" cy="196" r="1" opacity=".38" />
    <circle cx="352" cy="34" r="1.3" opacity=".62" /><circle cx="470" cy="222" r="1" opacity=".33" />
    <circle cx="596" cy="28" r="1.1" opacity=".5" /><circle cx="742" cy="212" r="1.2" opacity=".45" />
    <circle cx="884" cy="52" r="1" opacity=".4" /><circle cx="1012" cy="188" r="1.3" opacity=".58" />
    <circle cx="1128" cy="76" r="1" opacity=".36" /><circle cx="156" cy="118" r="1" opacity=".3" />
    <circle cx="668" cy="132" r="1" opacity=".28" /><circle cx="960" cy="112" r="1.1" opacity=".42" />
  </g>

  <!-- The system sits left of centre; the wordmark takes the right. Orbits are ellipses because
       the plane is viewed at an angle, matching the site's camera. -->
  <g transform="translate(300 130)">
    <g fill="none" stroke="#7fd3e6" stroke-opacity="0.22" stroke-width="1">
      <ellipse rx="78" ry="26" /><ellipse rx="112" ry="37" /><ellipse rx="148" ry="49" />
      <ellipse rx="190" ry="63" /><ellipse rx="236" ry="78" />
    </g>

    <circle r="34" fill="url(#corona)">
      <animate attributeName="r" values="32;37;32" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle r="11" fill="url(#core)" />

    <!-- Each planet rides its own ellipse. A `rotate` transform on the group would tilt the body
         too, so the orbit is expressed as a path and the planet travels it with animateMotion. -->
    <circle r="6" fill="url(#project)">
      <animateMotion dur="14s" begin="-3.5s" repeatCount="indefinite" rotate="0"
        path="M 78,0 A 78,26 0 1,1 -78,0 A 78,26 0 1,1 78,0" />
    </circle>
    <circle r="8" fill="url(#work)">
      <animateMotion dur="21s" begin="-13s" repeatCount="indefinite" rotate="0"
        path="M 112,0 A 112,37 0 1,1 -112,0 A 112,37 0 1,1 112,0" />
    </circle>
    <circle r="5.5" fill="url(#research)">
      <animateMotion dur="29s" begin="-7s" repeatCount="indefinite" rotate="0"
        path="M 148,0 A 148,49 0 1,1 -148,0 A 148,49 0 1,1 148,0" />
    </circle>
    <circle r="7" fill="url(#project)">
      <animateMotion dur="38s" begin="-27s" repeatCount="indefinite" rotate="0"
        path="M 190,0 A 190,63 0 1,1 -190,0 A 190,63 0 1,1 190,0" />
    </circle>
    <circle r="5" fill="url(#research)">
      <animateMotion dur="47s" begin="-33s" repeatCount="indefinite" rotate="0"
        path="M 236,0 A 236,78 0 1,1 -236,0 A 236,78 0 1,1 236,0" />
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="640" y="96" fill="#7fd3e6" font-size="12" letter-spacing="5.5">EECS · UC BERKELEY</text>
    <text x="640" y="152" fill="#f3efe6" font-size="46" letter-spacing="-0.5"
      font-family="Georgia, 'Times New Roman', serif">Ronit Katikaneni</text>
    <text x="640" y="186" fill="#b9b3a6" font-size="14" letter-spacing="0.3">ML systems, agent tooling, and apps people actually use.</text>
    <line x1="640" y1="210" x2="700" y2="210" stroke="#f2c069" stroke-width="2">
      <animate attributeName="x2" values="640;700;640" dur="5s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
